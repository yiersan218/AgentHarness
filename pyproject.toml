[project]
name = "agent-harness"
version = "0.1.0"
description = "A minimal AgentHarness scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.2,<2",
    "langgraph>=1.2,<2",
]

[project.scripts]
agent-harness = "agent_harness.cli:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
